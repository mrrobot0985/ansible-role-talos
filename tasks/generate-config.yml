---
# tasks file for talos – generate secrets & base config
# ──────────────────────────────────────────────────────────────
# Create encrypted secrets and base Talos configs (idempotent)
# ──────────────────────────────────────────────────────────────

- name: Check if Talos secrets file exists
  ansible.builtin.stat:
    path: "{{ talos_config_dir }}/config/secrets/secrets.yaml"
  register: secrets_stat
  run_once: true
  delegate_to: localhost
  tags: config

- name: Generate Talos secrets
  ansible.builtin.command: >-
    talosctl gen secrets
    -o {{ talos_config_dir }}/config/secrets/secrets.yaml
  args:
    creates: "{{ talos_config_dir }}/config/secrets/secrets.yaml"
  when: not secrets_stat.stat.exists
  run_once: true
  delegate_to: localhost
  tags: config

- name: Force regenerate Talos secrets
  ansible.builtin.command: >-
    talosctl gen secrets
    -o {{ talos_config_dir }}/config/secrets/secrets.yaml
    --force
  when: talos_force_generate | default(false) | bool
  run_once: true
  delegate_to: localhost
  tags: config

- name: Check if base Talos config exists
  ansible.builtin.stat:
    path: "{{ talos_config_dir }}/config/base/controlplane.yaml"
  register: base_stat
  run_once: true
  delegate_to: localhost
  tags: config

- name: Generate base Talos config
  ansible.builtin.command: >-
    talosctl gen config {{ cluster_name }} {{ cp_endpoint }}
    -o {{ talos_config_dir }}/config/base
    --with-secrets {{ talos_config_dir }}/config/secrets/secrets.yaml
  args:
    creates: "{{ talos_config_dir }}/config/base/controlplane.yaml"
  when:
    - not base_stat.stat.exists
    - not (talos_force_generate | default(false) | bool)
  run_once: true
  delegate_to: localhost
  tags: config

- name: Force regenerate base Talos config
  ansible.builtin.command: >-
    talosctl gen config {{ cluster_name }} {{ cp_endpoint }}
    -o {{ talos_config_dir }}/config/base
    --with-secrets {{ talos_config_dir }}/config/secrets/secrets.yaml
    --force
  when: talos_force_generate | default(false) | bool
  run_once: true
  delegate_to: localhost
  tags: config

- name: Set permissions on secrets
  ansible.builtin.file:
    path: "{{ talos_config_dir }}/config/secrets/secrets.yaml"
    mode: '0600'
  run_once: true
  delegate_to: localhost
  tags: config

- name: Set permissions on base configs
  ansible.builtin.file:
    path: "{{ talos_config_dir }}/config/base/{{ item }}"
    mode: '0600'
  loop:
    - controlplane.yaml
    - worker.yaml
    - talosconfig
  run_once: true
  delegate_to: localhost
  tags: config

- name: Set talosconfig endpoint to first control plane
  ansible.builtin.command: >-
    talosctl --talosconfig {{ talos_config_dir }}/config/base/talosconfig
    config endpoints {{ hostvars[groups.talos_controlplane[0]].ansible_host }}
  run_once: true
  delegate_to: localhost
  changed_when: false
  tags: config
