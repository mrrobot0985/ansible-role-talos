---
# roles/talos/tasks/bootstrap.yml
# ──────────────────────────────────────────────────────────────
# Bootstrap control plane and verify cluster readiness
# ──────────────────────────────────────────────────────────────

- name: Skip bootstrap when in dry-run mode
  ansible.builtin.meta: end_play
  when: talos_apply_dry_run | bool
  tags: bootstrap

# # -----------------------------------------------------------------
# # 1. Wait for first CP Talos API
# # -----------------------------------------------------------------
# - name: Wait for first control plane Talos API
#   talos_wait:
#     mode: api
#     host: "{{ hostvars[groups.talos_controlplane[0]].talos_ip }}"
#     port: 50000
#     timeout: 600
#     delay: 15
#   delegate_to: localhost
#   run_once: true
#   tags: bootstrap

# -----------------------------------------------------------------
# 2. Set talosconfig endpoint to bootstrap node
# -----------------------------------------------------------------
- name: Set talosconfig endpoint
  ansible.builtin.command: >-
    talosctl --talosconfig {{ talos_config_dir }}/config/base/talosconfig
    config endpoints {{ hostvars[groups.talos_controlplane[0]].talos_ip }}
  delegate_to: localhost
  run_once: true
  tags: bootstrap

# -----------------------------------------------------------------
# 3. Bootstrap first CP
# -----------------------------------------------------------------
- name: Bootstrap first CP
  ansible.builtin.command: >-
    talosctl --talosconfig {{ talos_config_dir }}/config/base/talosconfig
    bootstrap --nodes {{ hostvars[groups.talos_controlplane[0]].talos_ip }}
  delegate_to: localhost
  run_once: true
  tags: bootstrap

# -----------------------------------------------------------------
# 4. Fetch kubeconfig
# -----------------------------------------------------------------
- name: Fetch kubeconfig
  ansible.builtin.command: >-
    talosctl --talosconfig {{ talos_config_dir }}/config/base/talosconfig kubeconfig
    --nodes {{ hostvars[groups.talos_controlplane[0]].talos_ip }}
    --merge=false --force {{ playbook_dir }}/.talos/kubeconfig
  delegate_to: localhost
  run_once: true
  tags: bootstrap

# -----------------------------------------------------------------
# 5. Switch kubeconfig to use VIP (only when VIP exists)
# -----------------------------------------------------------------
- name: Rewrite kubeconfig to use VIP
  ansible.builtin.command: >-
    kubectl config set-cluster talos
    --server=https://{{ talos_vip | split('/') | first }}:6443
  environment:
    KUBECONFIG: "{{ playbook_dir }}/.talos/kubeconfig"
  delegate_to: localhost
  run_once: true
  when: talos_vip is defined and talos_vip | length > 0
  tags: bootstrap

# -----------------------------------------------------------------
# 6. Wait for K8s API (VIP if present, otherwise bootstrap node)
# -----------------------------------------------------------------
- name: Wait for K8s API on VIP
  talos_wait:
    mode: api
    host: "{{ talos_vip | split('/') | first }}"
    port: 6443
    timeout: 300
    delay: 10
  delegate_to: localhost
  run_once: true
  when: talos_vip is defined and talos_vip | length > 0
  tags: bootstrap

- name: Wait for K8s API on bootstrap node (single-node fallback)
  talos_wait:
    mode: api
    host: "{{ hostvars[groups.talos_controlplane[0]].talos_ip }}"
    port: 6443
    timeout: 300
    delay: 10
  delegate_to: localhost
  run_once: true
  when: talos_vip is not defined or talos_vip | length == 0
  tags: bootstrap

# -----------------------------------------------------------------
# 7. Wait for control-plane nodes Ready
# -----------------------------------------------------------------
- name: Wait for control-plane nodes Ready
  talos_wait:
    mode: nodes
    kubeconfig: "{{ playbook_dir }}/.talos/kubeconfig"
    label: node-role.kubernetes.io/control-plane
    count: "{{ groups.talos_controlplane | length }}"
    timeout: 1200
    delay: 10
  delegate_to: localhost
  run_once: true
  tags: bootstrap

# -----------------------------------------------------------------
# 8. Wait for worker nodes Ready
# -----------------------------------------------------------------
- name: Wait for worker nodes Ready
  talos_wait:
    mode: nodes
    kubeconfig: "{{ playbook_dir }}/.talos/kubeconfig"
    label: '!node-role.kubernetes.io/control-plane'
    count: "{{ (groups.talos_workers | default([])) | length }}"
    timeout: 600
    delay: 10
  delegate_to: localhost
  run_once: true
  when: "'talos_workers' in groups"
  tags: bootstrap

# ──────────────────────────────────────────────────────────────
# Generate cluster report
# ──────────────────────────────────────────────────────────────
- name: Generate cluster-wide data
  get_cluster_report:
    kubeconfig: "{{ playbook_dir }}/.talos/kubeconfig"
    talosconfig: "{{ talos_config_dir }}/config/base/talosconfig"
    first_cp_ip: "{{ hostvars[groups.talos_controlplane[0]].talos_ip }}"
  register: _cluster_report
  delegate_to: localhost
  run_once: true
  tags: cluster_report

- name: Render final cluster report
  ansible.builtin.template:
    src: cluster_report.j2
    dest: "{{ talos_report_dir }}/{{ cluster_name }}/cluster_report.md"
    mode: '0644'
  vars:
    network_module_result: "{{ hostvars[groups.talos_controlplane[0]].talos_network_global }}"
    talos_version: "{{ _cluster_report.talos_version }}"
    kube_api_reachable: "{{ _cluster_report.kube_api_reachable }}"
    system_pods: "{{ _cluster_report.system_pods }}"
    component_statuses: "{{ _cluster_report.component_statuses }}"
    cni: "{{ _cluster_report.cni }}"
  delegate_to: localhost
  run_once: true
  tags: cluster_report

- name: Cluster report generated
  ansible.builtin.debug:
    msg: "Cluster report written to {{ talos_report_dir }}/{{ cluster_name }}/cluster_report.md"
  run_once: true
  tags: cluster_report
