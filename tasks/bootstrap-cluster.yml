---
# roles/talos/tasks/bootstrap.yml
# ──────────────────────────────────────────────────────────────
# Bootstrap control plane and verify cluster readiness
# ──────────────────────────────────────────────────────────────

- name: Skip bootstrap when in dry-run mode
  ansible.builtin.meta: end_play
  when: talos_apply_dry_run | bool
  tags: bootstrap

# # -----------------------------------------------------------------
# # 1. Wait for first CP Talos API
# # -----------------------------------------------------------------
# - name: Wait for first control plane Talos API
#   talos_wait:
#     mode: api
#     host: "{{ hostvars[groups.talos_controlplane[0]].talos_ip }}"
#     port: 50000
#     timeout: 600
#     delay: 15
#   delegate_to: localhost
#   run_once: true
#   tags: bootstrap

# -----------------------------------------------------------------
# 2. Set talosconfig endpoint to bootstrap node
# -----------------------------------------------------------------
- name: Set talosconfig endpoint
  ansible.builtin.command: >-
    talosctl --talosconfig {{ talos_config_dir }}/config/base/talosconfig
    config endpoints {{ hostvars[groups.talos_controlplane[0]].talos_ip }}
  delegate_to: localhost
  run_once: true
  changed_when: false
  tags: bootstrap

# -----------------------------------------------------------------
# 3. Bootstrap first CP
# -----------------------------------------------------------------
- name: Bootstrap first CP
  ansible.builtin.command: >-
    talosctl --talosconfig {{ talos_config_dir }}/config/base/talosconfig
    bootstrap --nodes {{ hostvars[groups.talos_controlplane[0]].talos_ip }}
  delegate_to: localhost
  run_once: true
  changed_when: false
  failed_when: false
  tags: bootstrap

# -----------------------------------------------------------------
# 4. Fetch kubeconfig
# -----------------------------------------------------------------
- name: Fetch kubeconfig
  ansible.builtin.command: >-
    talosctl --talosconfig {{ talos_config_dir }}/config/base/talosconfig kubeconfig
    --nodes {{ hostvars[groups.talos_controlplane[0]].talos_ip }}
    --merge=false --force {{ talos_config_dir }}/kubeconfig
  delegate_to: localhost
  run_once: true
  tags: bootstrap

# -----------------------------------------------------------------
# 5. Switch kubeconfig to use VIP (only when VIP exists)
# -----------------------------------------------------------------
- name: Rewrite kubeconfig to use VIP
  ansible.builtin.command: >-
    kubectl config set-cluster {{ cluster_name }}
    --server=https://{{ talos_vip | split('/') | first }}:6443
  environment:
    KUBECONFIG: "{{ talos_config_dir }}/kubeconfig"
  delegate_to: localhost
  run_once: true
  when: talos_vip is defined and talos_vip | length > 0
  tags: bootstrap

# -----------------------------------------------------------------
# 6. Wait for K8s API (VIP if present, otherwise bootstrap node)
# -----------------------------------------------------------------
- name: Wait for K8s API on VIP
  ansible.builtin.wait_for:
    host: "{{ talos_vip | split('/') | first }}"
    port: 6443
    state: started
    timeout: 300
    delay: 10
  delegate_to: localhost
  run_once: true
  when: talos_vip is defined and talos_vip | length > 0
  tags: bootstrap

- name: Wait for K8s API on bootstrap node (single-node fallback)
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups.talos_controlplane[0]].talos_ip }}"
    port: 6443
    state: started
    timeout: 300
    delay: 10
  delegate_to: localhost
  run_once: true
  when: talos_vip is not defined or talos_vip | length == 0
  tags: bootstrap

# -----------------------------------------------------------------
# 7. Wait for control-plane nodes Ready
# -----------------------------------------------------------------
- name: Wait for control-plane nodes Ready
  ansible.builtin.shell: |
    set -eu
    for i in $(seq 1 120); do
      ready=$(kubectl --kubeconfig "{{ talos_config_dir }}/kubeconfig" \
        get nodes -l node-role.kubernetes.io/control-plane \
        -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
      count=$(echo "$ready" | grep -o "True" | wc -l)
      if [ "$count" -ge {{ groups.talos_controlplane | length }} ]; then
        echo "$count/{{ groups.talos_controlplane | length }} nodes ready"
        exit 0
      fi
      sleep 10
    done
    echo "Timeout waiting for control-plane nodes"
    exit 1
  delegate_to: localhost
  run_once: true
  changed_when: false
  tags: bootstrap

# -----------------------------------------------------------------
# 8. Wait for worker nodes Ready
# -----------------------------------------------------------------
- name: Wait for worker nodes Ready
  ansible.builtin.shell: |
    set -eu
    for i in $(seq 1 60); do
      ready=$(kubectl --kubeconfig "{{ talos_config_dir }}/kubeconfig" \
        get nodes -l '!node-role.kubernetes.io/control-plane' \
        -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
      count=$(echo "$ready" | grep -o "True" | wc -l)
      if [ "$count" -ge {{ (groups.talos_workers | default([])) | length }} ]; then
        echo "$count/{{ (groups.talos_workers | default([])) | length }} nodes ready"
        exit 0
      fi
      sleep 10
    done
    echo "Timeout waiting for worker nodes"
    exit 1
  delegate_to: localhost
  run_once: true
  changed_when: false
  when: "'talos_workers' in groups"
  tags: bootstrap

# ──────────────────────────────────────────────────────────────
# Generate cluster report
# ──────────────────────────────────────────────────────────────
- name: Check if Kubernetes API is reachable
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ talos_config_dir }}/kubeconfig
    cluster-info
  delegate_to: localhost
  run_once: true
  changed_when: false
  ignore_errors: true
  tags: cluster_report
  when: talos_generate_docs | bool
  register: _kube_api_check

- name: Gather cluster node info
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ talos_config_dir }}/kubeconfig
    get nodes -o json
  delegate_to: localhost
  run_once: true
  changed_when: false
  ignore_errors: true
  tags: cluster_report
  when: talos_generate_docs | bool
  register: _kube_nodes_raw

- name: Gather system pods
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ talos_config_dir }}/kubeconfig
    get pods -n kube-system -o json
  delegate_to: localhost
  run_once: true
  changed_when: false
  ignore_errors: true
  tags: cluster_report
  when: talos_generate_docs | bool
  register: _kube_pods_raw

- name: Extract pod names for CNI detection
  ansible.builtin.set_fact:
    _pod_names: >-
      {{-
        (_kube_pods_raw.stdout | from_json | default({})).items | default([])
        | map(attribute='metadata.name') | join(' ')
      }}
  delegate_to: localhost
  run_once: true
  tags: cluster_report
  when: talos_generate_docs | bool

- name: Detect CNI from running pods
  ansible.builtin.set_fact:
    _cni_detected: >-
      {{
        'cilium'
        if 'cilium' in (_pod_names | default(''))
        else 'flannel'
        if 'flannel' in (_pod_names | default(''))
        else 'unknown'
      }}
  delegate_to: localhost
  run_once: true
  tags: cluster_report
  when: talos_generate_docs | bool

- name: Extract node list from kubectl output
  ansible.builtin.set_fact:
    _report_nodes: >-
      {%- set ns = namespace(nodes=[]) %}
      {%- for item in ((_kube_nodes_raw.stdout | from_json | default({})).items | default([])) %}
      {%-   set role = 'control-plane'
            if 'node-role.kubernetes.io/control-plane' in (item.metadata.labels | default({}))
            else 'worker' %}
      {%-   set internal_ip = '' %}
      {%-   for addr in (item.status.addresses | default([])) %}
      {%-     if addr.type == 'InternalIP' %}
      {%-       set internal_ip = addr.address %}
      {%-     endif %}
      {%-   endfor %}
      {%-   set ready_status = 'Unknown' %}
      {%-   for cond in (item.status.conditions | default([])) %}
      {%-     if cond.type == 'Ready' %}
      {%-       set ready_status = cond.status %}
      {%-     endif %}
      {%-   endfor %}
      {%-   set ns.nodes = ns.nodes + [{
              'name': item.metadata.name,
              'roles': role,
              'internal_ip': internal_ip,
              'status': ready_status,
              'version': item.status.nodeInfo.kubeletVersion | default('unknown'),
            }] %}
      {%- endfor %}
      {{ ns.nodes }}
  delegate_to: localhost
  run_once: true
  tags: cluster_report
  when: talos_generate_docs | bool

- name: Extract system pod list from kubectl output
  ansible.builtin.set_fact:
    _report_pods: >-
      {%- set ns = namespace(pods=[]) %}
      {%- for item in ((_kube_pods_raw.stdout | from_json | default({})).items | default([])) %}
      {%-   set ready = item.status.containerStatuses | default([]) | map(attribute='ready') | list | count %}
      {%-   set total = item.status.containerStatuses | default([]) | length %}
      {%-   set restarts = item.status.containerStatuses | default([]) | map(attribute='restartCount') | list | sum %}
      {%-   set ns.pods = ns.pods + [{
              'name': item.metadata.name,
              'ready': ready ~ '/' ~ total,
              'restarts': restarts,
              'node': item.spec.nodeName | default(''),
            }] %}
      {%- endfor %}
      {{ ns.pods }}
  delegate_to: localhost
  run_once: true
  tags: cluster_report
  when: talos_generate_docs | bool

- name: Build cluster report
  ansible.builtin.set_fact:
    _cluster_report:
      kube_api_reachable: "{{ _kube_api_check.rc == 0 }}"
      talos_version: "{{ talos_facts.version | default('unknown') }}"
      nodes: "{{ _report_nodes | default([]) }}"
      system_pods: "{{ _report_pods | default([]) }}"
      component_statuses: []
      cni: "{{ _cni_detected | default('unknown') }}"
  delegate_to: localhost
  run_once: true
  tags: cluster_report
  when: talos_generate_docs | bool

# ──────────────────────────────────────────────────────────────
# Generate documentation
# ──────────────────────────────────────────────────────────────
- name: Build cluster documentation data structure
  ansible.builtin.set_fact:
    cluster_doc_data:
      site:
        name: "{{ cluster_name }}"
        status: "{{ 'active' if (_cluster_report.kube_api_reachable | default(false)) else 'planned' }}"
        vip: "{{ talos_vip | default('') }}"
        subnet: "{{ talos_network_global.cluster_subnet | default('') }}"
        kubernetes_api: >-
          {{
            'https://'
            ~ (talos_vip | split('/') | first | default(hostvars[groups.talos_controlplane[0]].talos_ip))
            ~ ':6443'
          }}
        cni: "{{ _cluster_report.cni | default('unknown') }}"
        talos_version: "{{ talos_facts.version | default('unknown') }}"
      devices: "{{ groups.all | sort | list }}"
      nodes: "{{ _cluster_report.nodes | default([]) }}"
      control_planes: "{{ groups.talos_controlplane | default([]) | sort | list }}"
      workers: "{{ groups.talos_workers | default([]) | sort | list }}"
  delegate_to: localhost
  run_once: true
  tags: [bootstrap, docs, cluster_report]
  when: talos_generate_docs | bool

- name: Generate cluster documentation data
  ansible.builtin.template:
    src: docs_cluster_data.yml.j2
    dest: "{{ talos_docs_dir }}/data/cluster.yml"
    mode: '0644'
  delegate_to: localhost
  run_once: true
  tags: [bootstrap, docs, cluster_report]
  when: talos_generate_docs | bool

- name: Generate cluster documentation page
  ansible.builtin.template:
    src: docs_cluster.md.j2
    dest: "{{ talos_docs_dir }}/docs/cluster.md"
    mode: '0644'
  vars:
    network_module_result: "{{ hostvars[groups.talos_controlplane[0]].talos_network_global }}"
    talos_version: "{{ _cluster_report.talos_version }}"
    kube_api_reachable: "{{ _cluster_report.kube_api_reachable }}"
    system_pods: "{{ _cluster_report.system_pods }}"
    component_statuses: "{{ _cluster_report.component_statuses }}"
    cni: "{{ _cluster_report.cni }}"
  delegate_to: localhost
  run_once: true
  tags: [bootstrap, docs, cluster_report]
  when: talos_generate_docs | bool

- name: Generate documentation index page
  ansible.builtin.template:
    src: docs_index.md.j2
    dest: "{{ talos_docs_dir }}/docs/index.md"
    mode: '0644'
  delegate_to: localhost
  run_once: true
  tags: [bootstrap, docs, cluster_report]
  when: talos_generate_docs | bool

- name: Generate MkDocs configuration
  ansible.builtin.template:
    src: docs_mkdocs.yml.j2
    dest: "{{ talos_docs_dir }}/mkdocs.yml"
    mode: '0644'
  delegate_to: localhost
  run_once: true
  tags: [bootstrap, docs, cluster_report]
  when: talos_generate_docs | bool

- name: Documentation generated
  ansible.builtin.debug:
    msg: "Documentation written to {{ talos_docs_dir }} — run 'cd {{ talos_docs_dir }} && mkdocs serve' to browse"
  run_once: true
  tags: [bootstrap, docs, cluster_report]
  when: talos_generate_docs | bool
