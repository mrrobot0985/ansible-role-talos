---
# tasks file for talos – gather and process node facts

- name: Wait for Talos API port 50000
  ansible.builtin.wait_for:
    host: "{{ talos_ip }}"
    port: 50000
    state: started
    timeout: 600
    delay: 15
  delegate_to: localhost
  tags: facts

- name: Wait for Talos API to be fully ready
  ansible.builtin.command: >-
    talosctl get machinestatus -o json --insecure -n {{ talos_ip }}
  delegate_to: localhost
  changed_when: false
  register: _api_ready
  retries: 30
  delay: 10
  until: _api_ready.rc == 0
  tags: facts

- name: Set apply mode based on dry-run flag
  ansible.builtin.set_fact:
    talos_apply_mode: >-
      {{ 'dry-run' if talos_apply_dry_run | bool else 'auto' }}
  run_once: false
  tags: [apply-config]

- import_tasks: gather-machinestatus.yml
  tags: [facts, machinestatus]

- import_tasks: gather-resources.yml
  tags: [facts, resources]

- import_tasks: gather-networking.yml
  tags: [facts, networking]
