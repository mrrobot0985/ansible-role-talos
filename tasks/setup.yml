---
# localhost setup – tools & dirs (final, actually minimal)

- name: Skip hosts without ansible_host
  ansible.builtin.meta: end_host
  when:
    - ansible_host is not defined or ansible_host | length == 0
  delegate_to: localhost
  tags: setup

- name: Set talos_ip with proper fallback
  ansible.builtin.set_fact:
    talos_ip: "{{ hostvars[inventory_hostname]['talos_ip'] | default(hostvars[inventory_hostname]['ansible_host']) }}"
  delegate_to: localhost
  tags: setup

- name: Create .talos directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ talos_config_dir }}/config/base"
    - "{{ talos_config_dir }}/config/secrets"
    - "{{ talos_config_dir }}/patches/nodes"
    - "{{ talos_config_dir }}/generated"
  run_once: true
  delegate_to: localhost
  tags: setup

- name: Create docs directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ talos_docs_dir }}/docs/nodes"
    - "{{ talos_docs_dir }}/data/nodes"
  run_once: true
  delegate_to: localhost
  tags: [setup, docs]
  when: talos_generate_docs | bool

- name: Ignore .talos in git
  ansible.builtin.copy:
    content: |
      ## Talos config
      .talos/
    dest: "{{ playbook_dir }}/.gitignore"
    mode: "0644"
  run_once: true
  delegate_to: localhost
  tags: setup

- name: Encrypt .talos with vault
  ansible.builtin.command: ansible-vault encrypt {{ talos_config_dir }}
  args:
    creates: "{{ talos_config_dir }}/.vault"
  environment:
    ANSIBLE_VAULT_PASSWORD_FILE: "{{ vault_pass_file | default('.vault_pass') }}"
  when: encrypt_talos_dir | default(false)
  run_once: true
  delegate_to: localhost
  tags: setup

- name: Gather localhost facts
  ansible.builtin.setup:
  delegate_to: localhost
  run_once: true
  tags: [setup]

- name: Ensure /usr/local/bin is in PATH
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^PATH='
    line: 'PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"'
    backup: yes
  become: true
  delegate_to: localhost
  tags: [setup]

- import_tasks: install-tools.yml
  run_once: true
  delegate_to: localhost
  tags: [setup, talosctl, kubectl, yq, docs, mkdocs]

- name: Verify node is in maintenance mode
  ansible.builtin.command: talosctl get machinestatus -o json --insecure -n {{ talos_ip }}
  changed_when: false
  failed_when: false
  register: maintenance_check
  delegate_to: localhost
  when: not talos_apply_dry_run | bool
  tags: setup

- name: Fail if node is not in maintenance mode
  ansible.builtin.fail:
    msg: >-
      Node {{ inventory_hostname }} ({{ talos_ip }}) is not in Talos
      maintenance mode. Boot from the Talos ISO and ensure port 50000
      is reachable.
  when:
    - not talos_apply_dry_run | bool
    - maintenance_check.rc != 0
  delegate_to: localhost
  tags: setup
