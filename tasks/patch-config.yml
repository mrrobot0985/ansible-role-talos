---
# ──────────────────────────────────────────────────────────────
# Patch the node configurations
# ──────────────────────────────────────────────────────────────
- name: Build per-node JSON patch
  ansible.builtin.set_fact:
    _node_patch: >-
      {{ talos_facts | talos_patch(
        inventory_hostname,
        inventory_hostname in groups.talos_controlplane,
        talos_cluster_dns | default([]),
        talos_cluster_ntp | default([]),
        customization | default({}),
        groups.talos_controlplane | length,
        (groups.talos_workers | default([])) | length
      ) }}
  delegate_to: localhost
  tags: [patch]

- name: Write JSON patch to file
  ansible.builtin.copy:
    content: "{{ _node_patch | to_nice_json }}"
    dest: "{{ talos_config_dir }}/patches/nodes/{{ inventory_hostname }}.json"
    mode: "0644"
  delegate_to: localhost
  tags: [patch]

- name: Remove stale generated config when force_generate is set
  ansible.builtin.file:
    path: "{{ talos_config_dir }}/generated/{{ inventory_hostname }}.yaml"
    state: absent
  when: talos_force_generate | default(false) | bool
  delegate_to: localhost
  tags: [patch]

- name: Apply patch to base config (handle multi-document YAML)
  ansible.builtin.shell: |
    set -eu
    TYPE="{{ 'controlplane' if inventory_hostname in groups.talos_controlplane else 'worker' }}"
    BASE="{{ talos_config_dir }}/config/base/${TYPE}.yaml"
    OUT="{{ talos_config_dir }}/generated/{{ inventory_hostname }}.yaml"
    TMP="$(mktemp)"
    # Extract only the first YAML document (machine + cluster config) so
    # talosctl machineconfig patch can process it.  v1.12+ gen config
    # always outputs multi-document YAML which machineconfig patch rejects.
    yq eval 'select(document_index == 0)' "$BASE" > "$TMP"
    talosctl machineconfig patch "$TMP" --patch @{{ talos_config_dir }}/patches/nodes/{{ inventory_hostname }}.json -o "$OUT"
    rm -f "$TMP"
    # Append any trailing documents (e.g. HostnameConfig) unchanged.
    EXTRA=$(yq eval 'select(document_index > 0)' "$BASE" 2>/dev/null || true)
    if [ -n "$EXTRA" ]; then
      printf '%s\n' '---' "$EXTRA" >> "$OUT"
    fi
  args:
    creates: "{{ talos_config_dir }}/generated/{{ inventory_hostname }}.yaml"
  delegate_to: localhost
  tags: [patch]
