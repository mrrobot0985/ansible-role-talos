---
- name: Install yq (pinned version from defaults/main.yml)
  ansible.builtin.get_url:
    url: >-
      https://github.com/mikefarah/yq/releases/download/{{ yq_version }}/yq_{{ ansible_system | lower }}_{{
        'amd64' if ansible_architecture == 'x86_64' else 'arm64'
      }}
    dest: /usr/local/bin/yq
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: [setup, yq]

- name: Verify yq
  ansible.builtin.command: yq --version
  changed_when: false
  tags: [setup, yq]
