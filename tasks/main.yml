---
# roles/talos/tasks/main.yml
# ──────────────────────────────────────────────────────────────
# Main entry point
# ──────────────────────────────────────────────────────────────
- import_tasks: setup.yml
  tags: setup

- import_tasks: generate-config.yml
  tags: config

- import_tasks: gather-facts.yml
  tags: facts

- import_tasks: patch-config.yml
  tags: patch

- import_tasks: apply-config.yml
  tags: apply-config

- import_tasks: bootstrap-cluster.yml
  tags: bootstrap

- name: Cluster is READY
  ansible.builtin.debug:
    msg: >-
      Talos cluster is up and running with {{ groups.all | length }} nodes!
      {% if talos_vip is defined and talos_vip | length > 0 %}
      VIP: {{ talos_vip }}
      {% else %}
      Single-cp mode (no VIP){%- endif %}
  run_once: true
