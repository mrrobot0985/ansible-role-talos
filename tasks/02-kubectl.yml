---
- name: Get latest stable kubectl version
  ansible.builtin.uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: yes
  register: kubectl_stable_version
  tags: [setup, kubectl]

- name: Set kubectl version fact
  ansible.builtin.set_fact:
    kubectl_version: "{{ kubectl_stable_version.content | trim }}"
  tags: [setup, kubectl]

- name: Download kubectl binary (amd64)
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /tmp/kubectl
    mode: '0755'
    checksum: "sha256:https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl.sha256"
  when: ansible_architecture == "x86_64"
  tags: [setup, kubectl]

- name: Download kubectl binary (arm64)
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/arm64/kubectl"
    dest: /tmp/kubectl
    mode: '0755'
    checksum: "sha256:https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/arm64/kubectl.sha256"
  when: ansible_architecture == "aarch64"
  tags: [setup, kubectl]

- name: Install kubectl to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/kubectl
    dest: /usr/local/bin/kubectl
    owner: root
    group: root
    mode: '0755'
    remote_src: yes
  become: yes
  tags: [setup, kubectl]

- name: Clean up downloaded binary
  ansible.builtin.file:
    path: /tmp/kubectl
    state: absent
  tags: [setup, kubectl]

- name: Verify kubectl installation
  ansible.builtin.command: kubectl version --client --output=yaml
  register: kubectl_verify
  changed_when: false
  tags: [setup, kubectl]

- name: Enable bash completion for kubectl
  ansible.builtin.blockinfile:
    path: /etc/bash.bashrc
    marker: "# {mark} ANSIBLE MANAGED KUBECTL COMPLETION"
    block: |
      source <(kubectl completion bash)
    create: yes
    mode: '0644'
  become: yes
  tags: [setup, kubectl]
