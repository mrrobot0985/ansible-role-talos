---
# Requires vagrant environment with pre-booted Talos Nodes
- name: BrainXio Talos
  hosts: talos_controlplane:talos_workers
  connection: local
  gather_facts: false
  roles:
    - name: mrrobot0985.talos
      role: ../../ansible-role-talos
      vars:
        talos_apply_dry_run: false
        talos_enable_vip: false
        talos_force_generate: true
        talos_config_dir: "{{ playbook_dir | dirname }}/.talos"
