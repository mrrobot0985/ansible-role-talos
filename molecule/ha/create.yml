---
- name: Create
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Boot HA Vagrant cluster
      ansible.builtin.shell: |
        set -e
        make flush 2>/dev/null || true
        CP_COUNT=3 WORKER_COUNT=2 make up
      args:
        chdir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: Ensure Molecule inventory directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/inventory"
        state: directory
        mode: "0755"

    - name: Copy Vagrant inventory for Molecule
      ansible.builtin.copy:
        src: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/.vagrant/inventory.yml"
        dest: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/inventory/hosts.yml"
        mode: "0644"
        remote_src: true

    - name: Save expected counts for verify
      ansible.builtin.copy:
        content: |
          ---
          expected_cp: 3
          expected_workers: 2
        dest: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/scenario_vars.yml"
        mode: "0644"
