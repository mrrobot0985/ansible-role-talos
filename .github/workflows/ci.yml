---
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint black flake8 pytest

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run black (check only)
        run: black --check filter_plugins/ tests/

      - name: Run flake8
        run: flake8 filter_plugins/ tests/

      - name: Run filter unit tests
        run: PYTHONPATH=${PWD}:$PYTHONPATH pytest tests/test_filters.py -v

      - name: Run markdownlint
        run: |
          npm install -g markdownlint-cli
          markdownlint docs/ README.md CONTRIBUTING.md

  config-smoke:
    name: Config Generation Smoke Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y ansible-core yq yamllint

      - name: Install talosctl
        run: |
          curl -sL https://talos.dev/install | sh
          talosctl version --client

      - name: Create test inventory
        run: |
          cat > ci-inventory.yml <<'INVENTORY'
          ---
          all:
            children:
              talos_controlplane:
                hosts:
                  cp-1:
                    ansible_host: 192.168.121.100
                    talos_ip: 192.168.121.100
                    node_type: controlplane
                  cp-2:
                    ansible_host: 192.168.121.101
                    talos_ip: 192.168.121.101
                    node_type: controlplane
              talos_workers:
                hosts:
                  worker-1:
                    ansible_host: 192.168.121.200
                    talos_ip: 192.168.121.200
                    node_type: worker
            vars:
              cluster_name: ci-smoke
              ansible_connection: local
          INVENTORY

      - name: Run role (dry-run, setup + config only)
        run: |
          cat > ci-playbook.yml <<'PLAYBOOK'
          ---
          - name: Config Smoke Test
            hosts: talos_controlplane:talos_workers
            connection: local
            gather_facts: false
            roles:
              - role: ansible-role-talos
                vars:
                  talos_apply_dry_run: true
                  talos_force_generate: true
                  talos_enable_vip: false
          PLAYBOOK
          ansible-playbook -i ci-inventory.yml ci-playbook.yml \
            --tags setup,config
        env:
          ANSIBLE_ROLES_PATH: "${PWD}/.."

      - name: Verify generated artifacts
        run: |
          test -f .talos/config/base/controlplane.yaml
          test -f .talos/config/base/worker.yaml
          test -f .talos/config/base/talosconfig
          test -f .talos/config/secrets/secrets.yaml
          echo "[+] Base configs generated OK"

      - name: Validate base configs with talosctl
        run: |
          talosctl validate --mode metal --config .talos/config/base/controlplane.yaml
          talosctl validate --mode metal --config .talos/config/base/worker.yaml

      - name: Validate base configs are lint-clean YAML
        run: |
          yamllint .talos/config/base/

  publish:
    name: Publish to Ansible Galaxy
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Publish role
        uses: robertdebock/galaxy-action@1.2.1
        with:
          galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
