---
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint black flake8

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run black (check only)
        run: black --check filter_plugins/ tests/

      - name: Run flake8
        run: flake8 filter_plugins/ tests/

      - name: Run filter unit tests
        run: PYTHONPATH=${PWD}:$PYTHONPATH pytest tests/test_filters.py -v

      - name: Run markdownlint
        run: |
          npm install -g markdownlint-cli
          markdownlint docs/ README.md TESTING.md CONTRIBUTING.md

  dry-run:
    name: Dry-Run Config Generation
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y ansible-core make

      - name: Create test files
        run: |
          cat > ci-inventory.yml <<'INVENTORY'
          ---
          all:
            children:
              talos_controlplane:
                hosts:
                  cp-1:
                    talos_ip: 192.168.121.100
                    node_type: controlplane
            vars:
              cluster_name: ci-test
          INVENTORY

          cat > ci-playbook.yml <<'PLAYBOOK'
          ---
          - name: CI Dry-Run Test
            hosts: all
            roles:
              - role: ansible-role-talos
                vars:
                  talos_apply_dry_run: true
                  talos_force_generate: true
          PLAYBOOK

      - name: Run setup and config phases
        run: |
          ansible-playbook -i ci-inventory.yml ci-playbook.yml \
            --tags setup,config \
            -e ansible_role_path="${PWD}"
        env:
          ANSIBLE_ROLES_PATH: "${PWD}/.."

      - name: Verify generated artifacts exist
        run: |
          test -f .talos/config/base/controlplane.yaml
          test -f .talos/config/base/worker.yaml
          test -f .talos/config/base/talosconfig
          test -f .talos/config/secrets/secrets.yaml

      - name: Validate base configs with talosctl
        run: |
          /usr/local/bin/talosctl validate --config .talos/config/base/controlplane.yaml || true
          /usr/local/bin/talosctl validate --config .talos/config/base/worker.yaml || true

  publish:
    name: Publish to Ansible Galaxy
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Publish role
        uses: robertdebock/galaxy-action@1.2.1
        with:
          galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
