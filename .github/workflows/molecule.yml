---
name: Molecule Tests

# Full integration tests requiring KVM/libvirt VMs.
# These cannot run on GitHub-hosted free runners (no nested virtualization).
# Run locally with `make molecule-test` or on a self-hosted runner with KVM.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  molecule:
    name: Molecule ${{ matrix.scenario }} (Talos ${{ matrix.talos_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Gate: skip on forks or when no self-hosted runner is available.
    # For self-hosted runs, override runs-on to [self-hosted, linux, kvm]
    if: github.repository == 'mrrobot0985/ansible-role-talos'
    strategy:
      fail-fast: false
      matrix:
        talos_version: ["v1.10.0", "v1.11.5"]
        scenario: ["default", "ha"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint molecule molecule-plugins

      - name: Install KVM and libvirt
        run: |
          sudo apt update -qq
          sudo apt install -y qemu-kvm libvirt-daemon-system \
            libvirt-clients bridge-utils libvirt-dev
          sudo usermod -aG libvirt $USER
          sudo systemctl start libvirtd

      - name: Install Vagrant
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | \
            sudo gpg --dearmor -o \
            /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update -qq
          sudo apt install -y vagrant
          vagrant plugin install vagrant-libvirt

      - name: Ensure libvirt default pool and network exist
        run: |
          sudo mkdir -p /var/lib/libvirt/images
          sudo virsh pool-define-as default dir --target /var/lib/libvirt/images 2>/dev/null || true
          sudo virsh pool-build default 2>/dev/null || true
          sudo virsh pool-start default 2>/dev/null || true
          sudo virsh pool-autostart default 2>/dev/null || true
          sudo virsh net-define /usr/share/libvirt/networks/default.xml 2>/dev/null || true
          sudo virsh net-start default 2>/dev/null || true
          sudo virsh net-autostart default 2>/dev/null || true

      - name: Run Molecule
        run: |
          export TALOS_VERSION=${{ matrix.talos_version }}
          molecule test -s ${{ matrix.scenario }}
        env:
          MOLECULE_DEBUG: "1"
