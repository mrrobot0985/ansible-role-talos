---
argument_specs:
  main:
    short_description: BrainXio Talos Linux cluster deployment role.
    description:
      - Production-grade, zero-touch deployment of Talos Linux Kubernetes clusters.
      - Full lifecycle automation including secrets generation, live node fact gathering,
        smart VIP calculation, per-node JSON patching, config apply, bootstrap,
        kubeconfig rewrite, and rich Markdown reports.
    options:
      # ──────────────────────────────────────────────────────────────
      # Core cluster settings
      # ──────────────────────────────────────────────────────────────
      talosctl_version:
        type: str
        default: "v1.11.5"
        required: false
        description: Version of the Talos CLI to install on the Ansible control node.

      cluster_name:
        type: str
        default: "talos-cluster"
        required: false
        description: Cluster name used in generated configs, reports, and kubeconfig contexts.

      # ──────────────────────────────────────────────────────────────
      # Networking and API endpoint
      # ──────────────────────────────────────────────────────────────
      talos_vip_rule:
        type: str
        default: "-1"
        required: false
        description:
          - VIP octet selection rule.
          - Use -1 to calculate VIP one octet below the lowest node IP.
          - Use +1 to calculate VIP one octet above the highest node IP.
          - Any other value is treated as an explicit final octet for the VIP.

      cp_endpoint:
        type: str
        default: "https://{{ hostvars[groups.talos_controlplane[0]].ansible_host }}:6443"
        required: false
        description: Kubernetes API endpoint URL passed to talosctl gen config.

      talos_ip:
        type: str
        default: "{{ hostvars[inventory_hostname]['talos_ip'] | default(hostvars[inventory_hostname]['ansible_host']) }}"
        required: false
        description:
          - IP address used to reach the Talos node via talosctl.
          - Defaults to the inventory talos_ip variable, falling back to ansible_host.

      cluster_dns_domain:
        type: str
        default: "cluster.local"
        required: false
        description: In-cluster DNS search domain.

      cluster_dns_servers:
        type: list
        elements: str
        default: []
        required: false
        description: List of upstream DNS server IP addresses for the cluster.

      # ──────────────────────────────────────────────────────────────
      # Node customization
      # ──────────────────────────────────────────────────────────────
      cluster_ntp_servers:
        type: list
        elements: str
        default: []
        required: false
        description: List of NTP servers for cluster time synchronization.

      talos_cluster_dns:
        type: list
        elements: str
        default: []
        required: false
        description: Alias for cluster_dns_servers, passed to the talos_patch filter.

      talos_cluster_ntp:
        type: list
        elements: str
        default: []
        required: false
        description: Alias for cluster_ntp_servers, passed to the talos_patch filter.

      customization:
        type: dict
        default: {}
        required: false
        description: Per-node customization dictionary for extra kernel args and system extensions.

      # ──────────────────────────────────────────────────────────────
      # Runtime behavior
      # ──────────────────────────────────────────────────────────────
      talos_force_generate:
        type: bool
        default: false
        required: false
        description:
          - When true, forces re-generation of secrets and base configs
            even if they already exist on disk.

      talos_apply_dry_run:
        type: bool
        default: true
        required: false
        description:
          - When true, the role generates and writes configs to disk
            but does not apply them to nodes. Set to false for actual deployment.

      talos_config_dir:
        type: str
        default: "{{ inventory_dir | default(playbook_dir) }}/.talos"
        required: false
        description: Root directory for all generated configs, patches, secrets, and reports.

      talos_docs_dir:
        type: str
        default: "{{ talos_config_dir }}/generated"
        required: false
        description: Directory where generated documentation and reports are written.

      # ──────────────────────────────────────────────────────────────
      # Documentation generation
      # ──────────────────────────────────────────────────────────────
      talos_generate_docs:
        type: bool
        default: false
        required: false
        description: When false, skips MkDocs and data output generation.

      encrypt_talos_dir:
        type: bool
        default: false
        required: false
        description: When true, encrypts the .talos directory with ansible-vault.

      vault_pass_file:
        type: str
        default: ".vault_pass"
        required: false
        description: Path to the ansible-vault password file.

      # ──────────────────────────────────────────────────────────────
      # Tool versions
      # ──────────────────────────────────────────────────────────────
      yq_version:
        type: str
        default: "v4.48.2"
        required: false
        description: Version of the yq binary to install on the Ansible control node.
