---
# vars file for talos
# ──────────────────────────────────────────────────────────────
# Working directories (runtime, not user-configurable)
# ──────────────────────────────────────────────────────────────
talosconfig_path: "{{ talos_config_dir }}/talosconfig"
talos_ip: "{{ hostvars[inventory_hostname]['talos_ip'] | default(hostvars[inventory_hostname]['ansible_host']) }}"

# ──────────────────────────────────────────────────────────────
# Derived paths (used internally by tasks)
# ──────────────────────────────────────────────────────────────
talos_secrets_path: "{{ talos_config_dir }}/config/secrets/secrets.yaml"
talos_base_cp_path: "{{ talos_config_dir }}/config/base/controlplane.yaml"
talos_base_worker_path: "{{ talos_config_dir }}/config/base/worker.yaml"
