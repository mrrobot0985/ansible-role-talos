---
# defaults file for talos
# ──────────────────────────────────────────────────────────────
# Core Talos & cluster settings
# ──────────────────────────────────────────────────────────────
talosctl_version: v1.11.5
cluster_name: "talos-cluster"
talos_enable_vip: true              # false → skip VIP calculation entirely
talos_vip_rule: "-1"               # -1 = auto-calculate, else explicit VIP IP

# ──────────────────────────────────────────────────────────────
# Kubernetes API endpoint (used by talosctl gen config)
# ──────────────────────────────────────────────────────────────
cp_endpoint: "https://{{ hostvars[groups.talos_controlplane[0]].ansible_host }}:6443"

# ──────────────────────────────────────────────────────────────
# Optional per-node customizations (declarative, no code changes)
# ──────────────────────────────────────────────────────────────
customization: {}                      # per-node customization dict (see docs)
cluster_ntp_servers: []               # e.g. ["time.google.com", "ntp.ubuntu.com"]
talos_cluster_dns: []                   # alias for cluster_dns_servers
talos_cluster_ntp: []                   # alias for cluster_ntp_servers

# ──────────────────────────────────────────────────────────────
# Runtime behavior
# ──────────────────────────────────────────────────────────────
talos_force_generate: false
talos_apply_dry_run: true
cluster_dns_domain: "cluster.local"   # Override DNS search domain
cluster_dns_servers: []               # List of upstream DNS

# ──────────────────────────────────────────────────────────────
# Vault encryption (optional)
# ──────────────────────────────────────────────────────────────
encrypt_talos_dir: false               # true → encrypt .talos/ with ansible-vault
vault_pass_file: ".vault_pass"         # path to vault password file

# ──────────────────────────────────────────────────────────────
# Working directories (override in inventory or extra vars)
# ──────────────────────────────────────────────────────────────
talos_config_dir: "{{ inventory_dir | default(playbook_dir) }}/.talos"

# ──────────────────────────────────────────────────────────────
# Additional packages
# ──────────────────────────────────────────────────────────────
yq_version: "v4.48.2"                  # or whatever version you want
